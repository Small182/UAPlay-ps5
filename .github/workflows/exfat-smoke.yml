name: Verify PS5 ShadowMount exFAT packaging

on:
  workflow_dispatch:
  push:
    branches: [fw13-exfat]
    paths:
      - 'scripts/package-native-exfat.sh'
      - '.github/workflows/exfat-smoke.yml'

permissions:
  contents: read

jobs:
  exfat-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PS5_TITLE_ID: PPSA99283
      PS5_NATIVE_OUTPUT: /tmp/uaplay-exfat-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes exfatprogs exfat-fuse fuse3 rsync
      - name: Make a representative PS5 title layout
        run: |
          bash -n scripts/package-native-exfat.sh
          mkdir -p "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID"/{sce_sys,sce_module,romfs}
          printf 'PS5 native title smoke check\n' > "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID/eboot.bin"
          printf '{"titleId":"PPSA99283"}\n' > "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID/sce_sys/param.json"
          printf 'libc placeholder\n' > "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID/sce_module/libc.prx"
          printf 'font placeholder\n' > "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID/romfs/InterVariable.ttf"
      - name: Create and verify exFAT readback
        run: |
          bash scripts/package-native-exfat.sh
          test -s "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID.exfat"
          file "$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID.exfat"
