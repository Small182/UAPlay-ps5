name: UAPlay PS5 Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [fw13-libvlc-native]
    paths:
      - 'source/**'
      - 'ps5/libvlc_mpv.c'
      - 'romfs/**'
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
permissions:
  contents: read
concurrency:
  group: uaplay-windows-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            curl unzip tar xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-ca-certificates
      - name: Compile and bundle native Windows EXE
        run: bash desktop/build-windows.sh
      - name: Verify PE imports and repair missing packaged DLLs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/windows-test | Out-Null
          $prefix = (Get-Content build/windows-host-bin.txt -Raw).Trim()
          python desktop/check-windows-bundle.py build/windows-preview "$prefix" 2>&1 | Tee-Object build/windows-test/dependencies.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create local video
        run: |
          set -euo pipefail
          mkdir -p build/windows-test
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 15 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac build/windows-test/test.mp4
      - name: Test EXE with native Windows launcher and no toolchain PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path build/windows-preview).Path
          $result = (Resolve-Path build/windows-test).Path
          $env:UAPLAY_PREVIEW_SMOKE = $result
          $env:UAPLAY_PREVIEW_VIDEO = Join-Path $result 'test.mp4'
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $env:VLC_PLUGIN_PATH = Join-Path $bundle 'plugins'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          public static class NativeErrorMode {
              [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode);
          }
          '@
          # No modal loader/crash dialogs: report the native NTSTATUS instead.
          [void][NativeErrorMode]::SetErrorMode(0x8003)
          $stdout = Join-Path $result 'stdout.log'
          $stderr = Join-Path $result 'stderr.log'
          $log = Join-Path $result 'test.log'
          "Launching native EXE: $bundle" | Set-Content $log
          $p = Start-Process -FilePath (Join-Path $bundle 'UAPlay.exe') -WorkingDirectory $bundle -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $finished = $p.WaitForExit(120000)
          if (!$finished) {
              $p.Kill()
              $p.WaitForExit()
          }
          Get-Content $stdout,$stderr -ErrorAction SilentlyContinue | Tee-Object -FilePath $log -Append
          if (!$finished) { throw 'UAPlay process exceeded 120 seconds' }
          $code = $p.ExitCode
          $hex = '{0:X8}' -f $code
          "Native Windows exit: $code (0x$hex)" | Tee-Object -FilePath $log -Append
          if ($code -ne 0) { throw "UAPlay test failed: 0x$hex" }
          if (!(Test-Path (Join-Path $result 'player-paused.bmp'))) { throw 'No player screenshot produced' }
          Remove-Item (Join-Path $bundle 'preview-data') -Recurse -Force -ErrorAction SilentlyContinue
      - name: Convert UI screenshots
        if: always()
        run: |
          shopt -s nullglob
          for bmp in build/windows-test/*.bmp; do
            ffmpeg -hide_banner -loglevel error -y -i "$bmp" "${bmp%.bmp}.png" && rm "$bmp"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UAPlay-PS5-Windows-UI-tests
          path: |
            build/windows-test/*.png
            build/windows-test/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UAPlay-PS5-Desktop-Windows-x64
          path: build/windows-preview/
          retention-days: 14
