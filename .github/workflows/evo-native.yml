name: UAPlay native EVO host (experimental)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evo-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evo-host
      - name: Install native build prerequisites
        run: brew install llvm lld coreutils nasm
      - name: Build EVO-based UAPlay test title
        run: bash ps5/build-evo-title.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UAPlay-PS5-EVO-native-UNTESTED
          path: UAPlay-PS5-EVO-test.tar.gz
          if-no-files-found: error
          retention-days: 14
