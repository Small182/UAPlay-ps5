name: UAPlay PS4 compatibility PKG (experimental)

on:
  workflow_dispatch:
  push:
    branches: [ps4-compat]
    paths:
      - 'source/**'
      - 'ps4/**'
      - 'scripts/build-ps4.sh'
      - 'scripts/prepare-tmdb-key.sh'
      - '.github/workflows/ps4-compat.yml'

permissions:
  contents: read

jobs:
  ps4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl cmake build-essential pkg-config
      - name: Install archived OpenOrbis SDK and media ports from GitHub
        run: |
          curl --fail --location --retry 4 --silent --show-error \
            https://github.com/PacBrew/pacbrew-packages/releases/download/1.0.0/pacbrew-ps4-openorbis-1.0.0.tar.xz \
            -o /tmp/pacbrew-ps4-openorbis.tar.xz
          # Official release archive contains only opt/pacbrew/ps4/**.
          sudo tar -xJf /tmp/pacbrew-ps4-openorbis.tar.xz -C /
          test -f /opt/pacbrew/ps4/openorbis/ps4vars.sh
          test -f /opt/pacbrew/ps4/openorbis/usr/lib/libmpv.a
      - name: Install OpenSSL 1.1 compatibility runtime for old PKG packager
        run: |
          curl --fail --location --retry 4 --silent --show-error \
            https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb \
            -o /tmp/openorbis-libssl11.deb
          sudo dpkg-deb --extract /tmp/openorbis-libssl11.deb /opt/pacbrew/openssl11
          echo /opt/pacbrew/openssl11/usr/lib/x86_64-linux-gnu | sudo tee /etc/ld.so.conf.d/openorbis-openssl11.conf
          sudo ldconfig
          test -f /opt/pacbrew/openssl11/usr/lib/x86_64-linux-gnu/libssl.so.1.1
      - name: Inject TMDb key for catalogue requests
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash scripts/prepare-tmdb-key.sh
      - name: Cross-compile actual UAPlay UI and libmpv player for PS4
        run: |
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          bash scripts/build-ps4.sh
          test -s build/ps4/UAPlay-PS4.pkg
      - name: Upload installable PS4 PKG (untested on hardware)
        uses: actions/upload-artifact@v4
        with:
          name: UAPlay-PS4-PKG-UNTESTED
          path: build/ps4/UAPlay-PS4.pkg
          if-no-files-found: error
