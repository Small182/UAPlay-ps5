name: Build native UAPlay with libmpv

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled native player dependencies
        run: |
          dkp-pacman -Q switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-libmpv switch-curl switch-pkg-config
      - name: Embed TMDB key in native build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -eu
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Repository secret TMDB_API_KEY is missing"
            exit 1
          fi
          if [ "${#TMDB_API_KEY}" -ne 32 ]; then
            echo "::error::TMDB_API_KEY must be a 32-character API v3 key"
            exit 1
          fi
          case "$TMDB_API_KEY" in
            *[!0123456789abcdefABCDEF]*)
              echo "::error::TMDB_API_KEY must contain hexadecimal characters only"
              exit 1
              ;;
          esac
          umask 077
          {
            printf '#ifndef UAPLAY_TMDB_BUILD_KEY_H\n#define UAPLAY_TMDB_BUILD_KEY_H\n'
            printf '#define UAPLAY_TMDB_BUILD_KEY "%s"\n' "$TMDB_API_KEY"
            printf '#endif\n'
          } > source/tmdb_build_key.h
      - name: Install network-enabled FFmpeg and libmpv for Switch
        run: |
          set -eu
          base=https://github.com/xfangfang/wiliwili/releases/download/v0.1.0
          curl -fL --retry 3 -o /tmp/switch-ffmpeg.pkg.tar.zst "$base/switch-ffmpeg-7.1-1-any.pkg.tar.zst"
          curl -fL --retry 3 -o /tmp/switch-libmpv.pkg.tar.zst "$base/switch-libmpv-0.36.0-3-any.pkg.tar.zst"
          dkp-pacman -U --noconfirm /tmp/switch-ffmpeg.pkg.tar.zst /tmp/switch-libmpv.pkg.tar.zst
          dkp-pacman -Q switch-ffmpeg switch-libmpv
      - name: Compile native NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          find "$DEVKITPRO" \( -iname '*sdl*.pc' -o -iname '*mpv*.pc' -o -name 'SDL.h' \) -print
          export PKG_CONFIG_PATH="$DEVKITPRO/portlibs/switch/lib/pkgconfig:$DEVKITPRO/libnx/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          make -j2
          test -s UAPlay.nro
      - uses: actions/upload-artifact@v4
        with:
          name: UAPlay-native
          path: UAPlay.nro
          if-no-files-found: error
