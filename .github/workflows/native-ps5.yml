name: UAPlay PS5 libVLC exFAT

on:
  workflow_dispatch:
  push:
    branches: [fw13-libvlc-native]
    paths:
      - 'source/**'
      - 'ps5/**'
      - 'romfs/**'
      - 'scripts/**'
      - '.github/workflows/native-ps5.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PS5_NATIVE_TEMPLATE: /tmp/uaplay-ps5-title-template
      PS5_NATIVE_OUTPUT: /tmp/uaplay-ps5-output
      PS5_TITLE_ID: PPSA99283
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 ccache git curl wget unzip rsync \
            build-essential pkg-config python3 cmake ninja-build libcurl4-openssl-dev ca-certificates exfatprogs exfat-fuse fuse3 \
            llvm-18 autoconf automake autopoint libtool gettext meson nasm bison flex texinfo gperf patch python3-mako
      - name: Check Switch 0.5.10 source version and native networking glue
        run: |
          set -euo pipefail
          cmp source/version.h switch-upstream/source/version.h
          grep -q '"0.5.10"' source/version.h
          grep -q 'int getaddrinfo(' source/console_curl.c
          grep -q '__wrap_fcntl' source/console_curl.c
          grep -q 'console_curl_setup(curl)' source/catalog.c
          grep -q 'console_curl_setup(curl)' source/posters.c
          python3 -m py_compile scripts/patch-ps5-linker.py
      - name: Verify portable catalogue behavior
        run: bash scripts/test-portable.sh
      - name: Retrieve pinned native title runtime
        run: |
          git clone --quiet https://github.com/leolobato/ps5-homebrew-ui.git "$PS5_NATIVE_TEMPLATE"
          git -C "$PS5_NATIVE_TEMPLATE" checkout --detach 0a6fb4b851da86cd4e9512aae3abf1352a96086a
          chmod +x "$PS5_NATIVE_TEMPLATE/tooling/prospero-clang18"
          bash "$PS5_NATIVE_TEMPLATE/tools/setup-native-dependencies.sh"
      - name: Prepare TMDb key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash scripts/prepare-tmdb-key.sh
      - name: Configure optional UAPlay-web catalogue API
        env:
          UAPLAY_WEB_API_URL: ${{ vars.UAPLAY_WEB_API_URL }}
        run: bash scripts/prepare-web-api.sh
      - name: Build pinned native libVLC and plugins
        run: bash scripts/prepare-libvlc-ps5.sh
      - name: Cross-compile the native PS5 UAPlay title
        run: bash scripts/build-ps5-software.sh
      - name: Verify native title files
        run: |
          title="$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID"
          test -s "$title/eboot.bin"
          test -s "$title/sce_sys/param.json"
          test -s "$title/sce_module/libc.prx"
          test -s "$title/romfs/InterVariable.ttf"
          test -s "$title/romfs/cacert.pem"
          chmod 755 "$title/eboot.bin"
      - name: Check exFAT packaging script
        run: bash -n scripts/package-native-exfat.sh
      - name: Create 64 KiB exFAT image for ShadowMountPlus
        run: bash scripts/package-native-exfat.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UAPlay-PS5-libVLC-exFAT-FW13-UNTESTED
          path: /tmp/uaplay-ps5-output/PPSA99283.exfat
          if-no-files-found: error
          retention-days: 14
