name: UAPlay PS5 libVLC exFAT

on:
  workflow_dispatch:
  push:
    branches: [fw13-libvlc-native]
    paths:
      - 'source/**'
      - 'ps5/**'
      - 'romfs/**'
      - 'scripts/**'
      - '.github/workflows/native-ps5.yml'

permissions:
  contents: read

concurrency:
  group: uaplay-ps5-libvlc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PS5_NATIVE_TEMPLATE: /tmp/uaplay-ps5-title-template
      PS5_NATIVE_OUTPUT: /tmp/uaplay-ps5-output
      PS5_TITLE_ID: PPSA99283
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 ccache git curl wget unzip rsync \
            build-essential pkg-config python3 cmake ninja-build libcurl4-openssl-dev ca-certificates exfatprogs exfat-fuse fuse3 \
            llvm-18 autoconf automake autopoint libtool gettext meson nasm bison flex texinfo gperf patch python3-mako
      - name: Check Switch 0.5.10 source version and native networking glue
        run: |
          set -euo pipefail
          cmp source/version.h switch-upstream/source/version.h
          grep -q '"0.5.10"' source/version.h
          grep -q 'int getaddrinfo(' source/console_curl.c
          grep -q '__wrap_fcntl' source/console_curl.c
          grep -q 'console_curl_setup(curl)' source/catalog.c
          grep -q 'console_curl_setup(curl)' source/posters.c
          python3 -m py_compile scripts/patch-ps5-linker.py
      - name: Verify portable catalogue behavior
        run: bash scripts/test-portable.sh
      # Restore only pinned toolchain/dependencies, never application objects
      # (which may contain the repository's TMDb build secret).
      - name: Restore PS5 SDK and PacBrew
        id: ps5_deps
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/uaplay-ps5-title-template/.deps/native
            /tmp/uaplay-ps5-title-template/.deps/pacbrew
          key: ${{ runner.os }}-${{ runner.arch }}-ps5-deps-v2-0a6fb4b851da86cd4e9512aae3abf1352a96086a
      - name: Retrieve pinned native title runtime
        run: |
          mkdir -p "$PS5_NATIVE_TEMPLATE"
          git -C "$PS5_NATIVE_TEMPLATE" init --quiet
          git -C "$PS5_NATIVE_TEMPLATE" fetch --quiet --depth=1 https://github.com/leolobato/ps5-homebrew-ui.git 0a6fb4b851da86cd4e9512aae3abf1352a96086a
          git -C "$PS5_NATIVE_TEMPLATE" checkout --detach FETCH_HEAD
          chmod +x "$PS5_NATIVE_TEMPLATE/tooling/prospero-clang18"
          bash "$PS5_NATIVE_TEMPLATE/tools/setup-native-dependencies.sh"
          bash "$PS5_NATIVE_TEMPLATE/tools/setup-pacbrew-dependencies.sh" --resolve sdl2 SDL2_ttf SDL2_image libcurl >/dev/null
      - name: Save PS5 SDK and PacBrew immediately
        if: steps.ps5_deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            /tmp/uaplay-ps5-title-template/.deps/native
            /tmp/uaplay-ps5-title-template/.deps/pacbrew
          key: ${{ steps.ps5_deps.outputs.cache-primary-key }}
      - name: Prepare TMDb key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash scripts/prepare-tmdb-key.sh
      - name: Configure optional UAPlay-web catalogue API
        env:
          UAPLAY_WEB_API_URL: ${{ vars.UAPLAY_WEB_API_URL }}
        run: bash scripts/prepare-web-api.sh
      # Keep the exact absolute paths: link.rsp contains absolute archive paths.
      # The key changes only when the upstream build recipe or pinned SDK changes.
      - name: Restore compiled libVLC, FFmpeg and plugins
        id: vlc_deps
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/uaplay-vlc-work/build-vlc-ps5
            /tmp/uaplay-vlc-work/prefix-ps5
            /tmp/uaplay-vlc-work/static-ps5
            /tmp/uaplay-vlc-work/src/vlc-3.0.24/include
          key: ${{ runner.os }}-${{ runner.arch }}-vlc-3.0.24-sdk-0.42-v2-${{ hashFiles('scripts/prepare-libvlc-ps5.sh') }}
      - name: Build or reuse pinned native libVLC and plugins
        run: |
          set -euo pipefail
          work=/tmp/uaplay-vlc-work
          if [[ "${{ steps.vlc_deps.outputs.cache-hit }}" == "true" ]] &&
             [[ -s "$work/build-vlc-ps5/lib/.libs/libvlc.a" &&
                -s "$work/build-vlc-ps5/src/.libs/libvlccore.a" &&
                -s "$work/static-ps5/static_modules.c" &&
                -s "$work/static-ps5/link.rsp" &&
                -s "$work/prefix-ps5/lib/libps5compat.a" &&
                -s "$work/src/vlc-3.0.24/include/vlc/vlc.h" ]]; then
            echo "Reusing compiled libVLC, FFmpeg and plugins"
            git clone --quiet --no-checkout https://github.com/ZiZc3/VLC.git /tmp/uaplay-vlc-upstream
            git -C /tmp/uaplay-vlc-upstream checkout --detach 7f104abb5a88dd675b60261769dc86d5dfb0a0d4
          else
            echo "Building native VLC dependencies (cold or incomplete cache)"
            rm -rf "$work"
            bash scripts/prepare-libvlc-ps5.sh
          fi
      - name: Save compiled VLC before UAPlay linking
        if: steps.vlc_deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            /tmp/uaplay-vlc-work/build-vlc-ps5
            /tmp/uaplay-vlc-work/prefix-ps5
            /tmp/uaplay-vlc-work/static-ps5
            /tmp/uaplay-vlc-work/src/vlc-3.0.24/include
          key: ${{ steps.vlc_deps.outputs.cache-primary-key }}
      - name: Cross-compile the native PS5 UAPlay title
        run: bash scripts/build-ps5-software.sh
      - name: Verify native title files
        run: |
          title="$PS5_NATIVE_OUTPUT/$PS5_TITLE_ID"
          test -s "$title/eboot.bin"
          test -s "$title/sce_sys/param.json"
          test -s "$title/sce_module/libc.prx"
          test -s "$title/romfs/InterVariable.ttf"
          test -s "$title/romfs/cacert.pem"
          chmod 755 "$title/eboot.bin"
      - name: Check exFAT packaging script
        run: bash -n scripts/package-native-exfat.sh
      - name: Create 64 KiB exFAT image for ShadowMountPlus
        run: bash scripts/package-native-exfat.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UAPlay-PS5-libVLC-exFAT-FW13-UNTESTED
          path: /tmp/uaplay-ps5-output/PPSA99283.exfat
          if-no-files-found: error
          retention-days: 14
