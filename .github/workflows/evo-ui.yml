name: EVO-based UAPlay frontend checks

on:
  push:
    branches: [evo-host]
    paths:
      - 'ps5/webui/**'
      - 'ps5/tests/**'
      - '.github/workflows/evo-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax and navigation
        run: |
          node --check ps5/webui/app.js
          node --check ps5/webui/providers.js
          node ps5/tests/webui_smoke.js
          node ps5/tests/providers_smoke.js
      - name: Check UI assets
        run: |
          test -s ps5/webui/index.html
          test -s ps5/webui/style.css
          test -s ps5/webui/InterVariable.ttf
          python3 -c 'import json; [json.load(open("ps5/webui/"+n+".json")) for n in ("top","movies","series")]'
      - name: Package frontend prototype (not a PS5 title)
        run: tar -C ps5 -czf UAPlay-EVO-webui-prototype.tar.gz webui
      - uses: actions/upload-artifact@v4
        with:
          name: UAPlay-EVO-webui-prototype-NOT-PS5-APP
          path: UAPlay-EVO-webui-prototype.tar.gz
          if-no-files-found: error
