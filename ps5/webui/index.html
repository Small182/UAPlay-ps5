<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>UAPlay PS5</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <header class="top"><span class="logo">UA<span>PLAY</span></span><nav id="nav"></nav><button id="search-toggle" aria-label="Пошук">⌕</button></header>
    <section class="hero" id="hero"></section>
    <section class="shelf"><div class="shelf-title"><h2 id="shelf-label">Популярне</h2><button id="more" tabindex="0">Більше ›</button></div><div class="posters" id="posters"></div></section>
    <section class="details hidden" id="details"></section>
    <section class="search hidden" id="search-panel"><input id="search-input" aria-label="Назва фільму або серіалу" placeholder="Пошук фільмів і серіалів…"><button class="action" id="search-submit">Шукати</button><button class="action secondary" id="search-close">Закрити</button></section>
    <footer><div class="legend" id="legend"></div><div class="build">UAPlay PS5 · EVO host development</div></footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
